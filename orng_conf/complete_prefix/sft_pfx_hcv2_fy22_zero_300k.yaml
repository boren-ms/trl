shuffle_dataset: False
train_data:
  cache_name: auto
  dataset_name: chunk
  max_egs: 300000
  max_chunks: 6000 # 50 egs/chunk
  max_cached_chunk: 10 # 50* 8=400 for all processes.
  chunk_shuffle: True # shuffle chunks
  chunk_types: [audio, info, transcription]
  # specs: [az://orngwus2cresco/data/boren/data/inhouse/data_spec/human_caption_v2.json]
  specs:
    - manifest_file: az://${DATA_STORAGE}/data/boren/data/inhouse/human_caption_v2/file_sets/FY22_AdjustBoundary_BiasLM_verbatim.json
      chunk_path: az://${DATA_STORAGE}/data/speech/am_data/en/human_caption_v2/FY22_AdjustBoundary_BiasLM/ChunkFiles

  context_prefix:
    log_interval: 1000
    prefix_range: [1, 50]

#   post_process:
#     streaming: True
#     do_shard: True
# accelerator_config:
#   dispatch_batches: False
# dataloader_prefetch_factor: 2
# dataloader_num_workers: 2
# model_name_or_path: /root/data/ckp/hf_models/phi4_mm_bias
model_name_or_path: /root/data/ckp/hf_models/Phi-4-multimodal-instruct
# model_name_or_path: /root/data/ckp/hf_models/phi-libri_ft_m1000_p8_new-QpHq/5000_hf
# model_name_or_path: /datablob1/users/boren/data/hf_models/phi-libri_ft_m1000_p8_new-QpHq_v1
report_to: [wandb]
num_train_epochs: 1
# max_steps: 10000 # num_egs = 1000*8*N_GPU(8) = 64k
learning_rate: 1e-5
lr_scheduler_type: cosine #cosine
output_dir: ./output
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
per_device_eval_batch_size: 16
logging_steps: 10
bf16: True
gradient_checkpointing: True
max_completion_length: 1024
save_only_model: True
save_total_limit: 5
save_on_each_node: True
save_steps: 100
eval_strategy: steps
eval_on_start: False
eval_steps: 200
eval_data:
  - nickname: clean_no
    dataset_name: ls_bias
    jsonl_path: /root/data/librispeech_biasing/ref/test-clean.biasing_100.jsonl
    data_dir: az://${DATA_STORAGE}/data/boren/data
  - nickname: other_no
    dataset_name: ls_bias
    jsonl_path: /root/data/librispeech_biasing/ref/test-other.biasing_100.jsonl
    data_dir: az://${DATA_STORAGE}/data/boren/data
