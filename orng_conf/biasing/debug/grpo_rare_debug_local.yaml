    tsv_paths: /home/boren/data/LibriSpeech/debug.tsv
    # cache_name: auto_train
    num_proc: 1
    add_rare_keywords:
        common_file: /home/boren/data/librispeech_biasing/words/all_words.count.txt
        common_num: 1000
    filter_by_keywords:
        min_num: 1
    add_prompt:
        task: rare_asr
        forced: True

eval_strategy: steps
eval_on_start: False
eval_steps: 10
per_device_eval_batch_size: 200
num_eval_generations: 2
