# vllm_server_host: ${VLLM_SERVER_HOST}
# vllm_server_host: 10.133.219.39
# vllm_server_port: 26500

train_data:
    dataset_name: tsv
    # nug_egs: 5000
    # tsv_paths: az://${DATA_STORAGE}/data/boren/data/LibriSpeech/debug.tsv
