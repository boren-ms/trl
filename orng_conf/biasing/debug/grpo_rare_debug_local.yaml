model_name_or_path: /home/boren/data/ckp/hf_models/Phi-4-multimodal-instruct
new_run: True
reward_funcs: [reward_full_error, reward_bias_error]
reward_func_kwargs:
    tn: simple
    unit: char
report_to: [] # no wandb
learning_rate: 1e-5
save_only_model: True
save_total_limit: 5
save_on_each_node: True
# new_lora: True
# lr_scheduler_type: cosine
output_dir: ~/outputs/debug_rare
# per_device_train_batch_size: 24
per_device_train_batch_samples: 3
num_generations: 4
# generation_scale: 2
min_reward_std: 0.0001
# reward_range: [-100, 0.00001]
gradient_accumulation_steps: 2
diff_completion_mask: True
# inject_reference: True
# token_entropy_percentile_threshold: 0.8
# dataloader_drop_last: True

shift_rewards: False
scale_rewards: False
temperature: 1.1
logging_steps: 1
bf16: True
gradient_checkpointing: True
log_completions: True
max_prompt_length: 1024
max_completion_length: 512
#
# beta: 0.1
epsilon_high: 0.28
save_steps: 100
use_vllm: True
vllm_mode: colocate
vllm_tensor_parallel_size: 1
vllm_gpu_memory_utilization: 0.30
vllm_imp_ratio_cap: 5
