shuffle_dataset: False
train_data:
  cache_name: auto
  dataset_name: chunk
  max_egs: 300000
  max_chunks: 6000 # 50 egs/chunk
  max_cached_chunk: 10 # 50* 8=400 for all processes.
  chunk_shuffle: True # shuffle chunks
  chunk_types: [audio, info, transcription]
  specs:
    - manifest_file: az://${DATA_STORAGE}/data/boren/data/inhouse/human_caption_v2/file_sets/FY22_AdjustBoundary_BiasLM_verbatim.json
      chunk_path: az://${DATA_STORAGE}/data/speech/am_data/en/human_caption_v2/FY22_AdjustBoundary_BiasLM/ChunkFiles
  add_prompt:
    task: asr
  num_proc: 2
  add_rare_keywords:
    common_file: az://${DATA_STORAGE}/data/boren/data/librispeech_biasing/words/all_words.count.txt
    common_num: 1000
  filter_by_keywords:
    min_ratio: 0.1
reward_funcs: [reward_full_error, reward_bias_error]
reward_func_kwargs:
  tn: simple_with_tag
  unit: char
reward_weights: [1, 5]
# reward_funcs: [reward_unbias_accuracy, reward_bias_accuracy]
# scale_rewards: True
# model_name_or_path: /root/data/ckp/hf_models/phi4_mm_bias
model_name_or_path: /root/data/ckp/hf_models/Phi-4-multimodal-instruct
# model_name_or_path: /root/data/ckp/hf_models/phi-libri_ft_m1000_p8_new-QpHq/5000_hf
# model_name_or_path: /datablob1/users/boren/data/hf_models/phi-libri_ft_m1000_p8_new-QpHq_v1
# job_name: phi4_mm_bias_grpo
report_to: [wandb]
max_steps: 300000 # num_egs = 1000*8*N_GPU(8) = 64k
# num_train_epochs: 0.5
learning_rate: 1e-5
# new_lora: True
lr_scheduler_type: cosine #cosine
temperature: 1.2
output_dir: ./output
project_name: biasing_entity
per_device_train_batch_samples: 2
num_generations: 8
# generation_scale: 2
inject_reference: True
# token_entropy_percentile_threshold: 0.8
# steps_per_generation: 2 # generate 4 batches
gradient_accumulation_steps: 4
logging_steps: 10
bf16: True
gradient_checkpointing: True
log_completions: True
max_prompt_length: 6000
max_completion_length: 512
wandb_log_unique_prompts: True
# beta: 0.1
epsilon_high: 0.28
save_only_model: True
save_total_limit: 5
save_on_each_node: True
save_steps: 100
use_vllm: True
vllm_mode: colocate
vllm_tensor_parallel_size: 1
vllm_gpu_memory_utilization: 0.35
vllm_imp_ratio_cap: 5
# vllm_server_host: ${VLLM_SERVER_HOST} # dev-n1-wus2-0
# vllm_server_port: 26500

eval_strategy: steps
eval_on_start: False
eval_steps: 200
per_device_eval_batch_size: 200
num_eval_generations: 2
eval_data:
  - nickname: clean_no
    dataset_name: ls_bias
    jsonl_path: /root/data/librispeech_biasing/ref/test-clean.biasing_100.jsonl
    tag: ""
    data_dir: az://${DATA_STORAGE}/data/boren/data
  - nickname: other_no
    dataset_name: ls_bias
    jsonl_path: /root/data/librispeech_biasing/ref/test-other.biasing_100.jsonl
    tag: ""
    data_dir: az://${DATA_STORAGE}/data/boren/data
